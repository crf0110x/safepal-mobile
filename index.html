<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafePal Mobile Wallet</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161a23;
      --border-color: #262b38;
      --primary: #2b6aff;
      --text-main: #ffffff;
      --text-secondary: #848e9c;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* En-tête mobile */
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-logo {
      width: 32px;
      height: 32px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 800;
    }

    .network-badge {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .network-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    /* Contenu scrollable */
    .mobile-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Écran de connexion */
    .login-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }

    .input-style {
      width: 100%;
      padding: 14px;
      background: var(--card-bg);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      color: #fff;
      box-sizing: border-box;
      outline: none;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #2b6aff 0%, #1a55e1 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43, 106, 255, 0.3);
    }

    /* Balance mobile */
    .balance-card {
      background: linear-gradient(135deg, #161a23 0%, #1e2433 100%);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .balance-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .balance-amount {
      font-size: 34px;
      font-weight: 900;
      margin: 8px 0;
      letter-spacing: -0.5px;
    }

    .balance-sub {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Grille d'actions mobiles */
    .mobile-actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .action-btn-mobile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .action-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
    }

    .action-btn-mobile:hover .action-icon-box {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      color: #c9d1d9;
    }

    /* Liste des actifs mobile */
    .assets-section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .asset-card-mobile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
      cursor: pointer;
    }

    .asset-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .asset-icon-mobile {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .asset-symbol {
      font-size: 15px;
      font-weight: 700;
    }

    .asset-price {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .asset-right {
      text-align: right;
    }

    .asset-holding {
      font-size: 15px;
      font-weight: 700;
    }

    .asset-fiat-val {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Barre de navigation inférieure mobile (Bottom Nav) */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 18px;
    }

    /* Modales mobiles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      z-index: 2000;
    }

    .modal-sheet {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-radius: 24px 24px 0 0;
      padding: 24px;
      width: 100%;
      box-sizing: border-box;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      text-align: center;
    }

    .sheet-body {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 18px;
      text-align: center;
      line-height: 1.5;
      word-break: break-all;
    }

    .hidden {
      display: none !important;
    }

    .select-style {
      width: 100%;
      padding: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      margin-bottom: 12px;
      outline: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Écran de Connexion Mobile -->
  <div id="loginScreen" class="login-screen">
    <div style="margin-bottom: 30px;">
      <svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto 15px auto; display:block;">
        <circle cx="50" cy="50" r="50" fill="#3F25D6"/>
        <path d="M72 32H38L22 48L32 58H66L72 52V32Z" fill="white"/>
        <path d="M28 68H62L78 52L68 42H34L28 48V68Z" fill="white"/>
        <rect x="35" y="38" width="30" height="24" rx="4" fill="#3F25D6"/>
      </svg>
      <h2 style="font-size: 22px; font-weight: 900; margin: 0;">SafePal Mobile</h2>
      <p style="color: var(--text-secondary); font-size: 13px; margin-top: 6px;">Secure Decentralized Crypto Wallet</p>
    </div>
    <input type="text" id="mobilePrivateKeyInput" class="input-style" placeholder="Insert private key or 0x...">
    <button class="btn-primary" id="btnMobileLogin">Access Wallet</button>
  </div>

  <!-- Dashboard Principal Mobile -->
  <div id="dashboardScreen" class="hidden" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
    <div class="mobile-header">
      <div class="brand-area">
        <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="50" fill="#3F25D6"/>
          <path d="M72 32H38L22 48L32 58H66L72 52V32Z" fill="white"/>
          <path d="M28 68H62L78 52L68 42H34L28 48V68Z" fill="white"/>
          <rect x="35" y="38" width="30" height="24" rx="4" fill="#3F25D6"/>
        </svg>
        <span class="app-title">SafePal</span>
      </div>
      <div class="network-badge" id="mobileNetworkToggle">
        <div class="network-dot"></div>
        <span id="mobileNetworkName">BSC</span>
      </div>
    </div>

    <div class="mobile-content">
      <!-- Balance Card -->
      <div class="balance-card">
        <div class="balance-label">Total Portfolio Balance</div>
        <div class="balance-amount" id="mobileTotalBalance">0,00 €</div>
        <div class="balance-sub" id="mobileSubBalance">≈ 0 BTC</div>
      </div>

      <!-- Actions Grid -->
      <div class="mobile-actions">
        <button class="action-btn-mobile" id="mSendBtn">
          <div class="action-icon-box">↑</div>
          <span class="action-label">Send</span>
        </button>
        <button class="action-btn-mobile" id="mReceiveBtn">
          <div class="action-icon-box">↓</div>
          <span class="action-label">Receive</span>
        </button>
        <button class="action-btn-mobile" id="mSwapBtn">
          <div class="action-icon-box">⇄</div>
          <span class="action-label">Swap</span>
        </button>
        <button class="action-btn-mobile" id="mDepositBtn">
          <div class="action-icon-box">💳</div>
          <span class="action-label">Deposit</span>
        </button>
        <button class="action-btn-mobile" id="mMoreBtn">
          <div class="action-icon-box">≡</div>
          <span class="action-label">Settings</span>
        </button>
      </div>

      <div class="assets-section-title">Crypto Assets</div>
      <div id="mobileAssetList"></div>
    </div>

    <!-- Barre de navigation inférieure mobile -->
    <div class="bottom-nav">
      <button class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span>Wallet</span>
      </button>
      <button class="nav-item" id="navSwapBtn">
        <span class="nav-icon">⇄</span>
        <span>Swap</span>
      </button>
      <button class="nav-item" id="navDepositBtn">
        <span class="nav-icon">💳</span>
        <span>Deposit</span>
      </button>
      <button class="nav-item" id="navSettingsBtn">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </button>
    </div>
  </div>

  <!-- Modale Mobile (Bottom Sheet) -->
  <div id="mobileModal" class="modal-overlay hidden">
    <div class="modal-sheet">
      <div id="mModalTitle" class="sheet-title">Title</div>
      <div id="mModalBody" class="sheet-body">Body message</div>

      <!-- Container Adresse -->
      <div id="mAddressContainer" class="hidden" style="margin-bottom: 16px;">
        <input type="text" id="mAddressDisplay" class="input-style" readonly style="text-align:center; font-weight:bold; color:var(--primary);" />
      </div>

      <!-- Container Swap -->
      <div id="mSwapContainer" class="hidden">
        <label style="font-size:12px; color:var(--text-secondary); display:block; text-align:left; margin-bottom:6px;">Pay (From):</label>
        <select id="mSwapFrom" class="select-style"></select>
        <input type="number" id="mSwapAmount" class="input-style" value="0.1" step="0.01" />
        <label style="font-size:12px; color:var(--text-secondary); display:block; text-align:left; margin-bottom:6px;">Receive (To):</label>
        <select id="mSwapTo" class="select-style"></select>
        <div id="mSwapEstimate" style="font-size:13px; color:var(--primary); font-weight:bold; margin-bottom:16px; text-align:left;">Estimated: ...</div>
      </div>

      <!-- Container Dépôt / Gateways -->
      <div id="mDepositContainer" class="hidden">
        <button class="btn-primary" id="mMoonpayBtn" style="margin-bottom:10px;">MoonPay Gateway</button>
        <button class="btn-primary" id="mSimplexBtn" style="background:linear-gradient(90deg, #34d399 0%, #059669 100%); margin-bottom:10px;">Simplex Gateway</button>
        <button class="btn-primary" id="mRampBtn" style="background:linear-gradient(90deg, #f59e0b 0%, #d97706 100%); margin-bottom:10px;">Ramp</button>
        <button class="btn-primary" id="mBankWireBtn" style="background:linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%);">Bank Wire Transfer</button>
      </div>

      <!-- Container Lien Gateway -->
      <div id="mLinkContainer" class="hidden">
        <input type="text" id="mLinkInput" class="input-style" readonly />
        <button class="btn-primary" id="mCopyLinkBtn">Copy Link</button>
      </div>

      <!-- Container POA -->
      <div id="mPoaContainer" class="hidden">
        <div class="poa-box" id="mPoaText" style="background: rgba(224,45,60,0.1); border:1px solid #e02d3c; border-radius:12px; padding:12px; margin-bottom:14px; color:#f87171; font-size:12px; text-align:left;"></div>
        <div class="poa-signal" id="mPoaSignal" style="background:var(--bg-color); border:1.5px solid var(--primary); border-radius:10px; padding:12px; color:var(--primary); font-weight:bold; margin-bottom:16px;"></div>
      </div>

      <!-- Input Standard -->
      <div id="mInputContainer" class="hidden">
        <input type="text" id="mCustomInput" class="input-style" placeholder="0x..." />
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="mCancelBtn" class="btn-primary" style="background: var(--border-color); color: #fff;">Cancel</button>
        <button id="mConfirmBtn" class="btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="ethers.umd.min.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
